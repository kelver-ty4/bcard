<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamza El Kaoui — Business Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background-color: #1a1410;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: 'Inter', sans-serif;
    }
    .card {
      background: #f5efe6;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      position: relative;
      border: 1px solid #d4b896;
    }
    .top-line { width: 60px; height: 2px; background: #1a1410; margin: 0 auto 2rem; }
    .label { font-size: 11px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: #8a6d4e; margin-bottom: 1rem; }
    .name { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: #1a1410; line-height: 1.2; margin-bottom: 0.4rem; }
    .subtitle { font-size: 13px; color: #8a6d4e; letter-spacing: 1px; margin-bottom: 2rem; }
    .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 2rem; }
    .divider-line { flex: 1; height: 1px; background: #d4b896; }
    .divider-dot { width: 5px; height: 5px; border-radius: 50%; background: #8a6d4e; }
    .message { font-size: 15px; color: #4a3728; line-height: 1.7; margin-bottom: 2rem; }
    .message strong { color: #1a1410; font-weight: 500; }
    .download-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: #1a1410; color: #f5efe6; border: none; border-radius: 50px;
      padding: 14px 32px; font-family: 'Inter', sans-serif; font-size: 14px;
      font-weight: 500; letter-spacing: 1px; cursor: pointer; text-decoration: none;
      margin-bottom: 1rem;
    }
    .hint { font-size: 12px; color: #a08060; letter-spacing: 0.5px; }
    .corner-ornament { position: absolute; width: 30px; height: 30px; opacity: 0.3; }
    .corner-ornament.tl { top: 16px; left: 16px; border-top: 2px solid #8a6d4e; border-left: 2px solid #8a6d4e; }
    .corner-ornament.tr { top: 16px; right: 16px; border-top: 2px solid #8a6d4e; border-right: 2px solid #8a6d4e; }
    .corner-ornament.bl { bottom: 16px; left: 16px; border-bottom: 2px solid #8a6d4e; border-left: 2px solid #8a6d4e; }
    .corner-ornament.br { bottom: 16px; right: 16px; border-bottom: 2px solid #8a6d4e; border-right: 2px solid #8a6d4e; }
    .icon-wrap { width: 64px; height: 64px; border-radius: 50%; background: #1a1410; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
    .bottom-line { width: 60px; height: 2px; background: #1a1410; margin: 2rem auto 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="corner-ornament tl"></div>
    <div class="corner-ornament tr"></div>
    <div class="corner-ornament bl"></div>
    <div class="corner-ornament br"></div>
    <div class="top-line"></div>
    <div class="icon-wrap">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f5efe6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="9" cy="10" r="2"/>
        <path d="M15 8h2M15 12h2M7 16h10"/>
      </svg>
    </div>
    <div class="label">Business Card</div>
    <div class="name">Hamza El Kaoui</div>
    <div class="subtitle">Your card is ready</div>
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-dot"></div>
      <div class="divider-line"></div>
    </div>
    <p class="message">The business card of <strong>Hamza El Kaoui</strong><br>will be downloaded to your device shortly.</p>
    <a class="download-btn" id="dl" href="card.png" download="HamzaElKaoui_BusinessCard.png">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15V3m0 12l-4-4m4 4l4-4"/>
        <path d="M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17"/>
      </svg>
      Download Card
    </a>
    <p class="hint">Tap the button if download doesn't start</p>
    <div class="bottom-line"></div>
  </div>
  <script>
    fetch("card.png")
      .then(res => res.blob())
      .then(blob => {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "HamzaElKaoui_BusinessCard.png";
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
      });
  </script>
</body>
</html>
